<script>
  function scaleIframe() {
    const container = document.querySelector('#noaa-iframe').parentElement;
    const iframe = document.querySelector('#noaa-iframe');
    const nativeWidth = 800; // approximate native width of the NOAA page
    const scale = container.offsetWidth / nativeWidth;
    iframe.style.transform = `scale(${scale})`;
    iframe.style.width = nativeWidth + 'px';
    iframe.style.height = (nativeWidth * 0.5625) + 'px';
    container.style.paddingBottom = (nativeWidth * 0.5625 * scale) + 'px';
  }

  window.addEventListener('resize', scaleIframe);
  window.addEventListener('load', scaleIframe);
</script>
